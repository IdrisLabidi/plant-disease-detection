# Canonical preprocessing, versioning, and output contract for exported models.
# Expected layout: models/<classifiers|segmenters>/<model_name>/<version>/model.ts (+ model_config.json)
# Training/export code and serving code must verify this file before inference.
# Cards are not evidence that the model has field-level accuracy.

classifier_mobilenet_v3:
  version: 2026-11-20
  task: crop_disease_classification
  architecture: mobilenet_v3_large
  trained_on:
    dataset: geraldmc/plantvillage-full
    license: verify dataset terms before redistribution
  input:
    size: [224, 224]
    resize_rule: stretch_to_exact_size
    preserve_aspect_ratio: false
    crop: none
    color: RGB
    scale: 0-1
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  output:
    type: logits
    postprocessing: softmax_across_classes
    softmax_inside_model: false
  class_order:
    source: sorted_unique_class_label
    dataset_field: class_label
    count: runtime_from_model_config
    config: model_config.json
  unsure_threshold:
    value: null
    status: not_selected_on_validation

classifier_resnet50:
  version: 2026-11-20
  task: crop_disease_classification
  architecture: resnet50
  trained_on:
    dataset: geraldmc/plantvillage-full
    license: verify dataset terms before redistribution
  input:
    size: [224, 224]
    resize_rule: stretch_to_exact_size
    preserve_aspect_ratio: false
    crop: none
    color: RGB
    scale: 0-1
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  output:
    type: logits
    postprocessing: softmax_across_classes
    softmax_inside_model: false
  class_order:
    source: sorted_unique_class_label
    dataset_field: class_label
    count: runtime_from_model_config
    config: model_config.json
  unsure_threshold:
    value: null
    status: not_selected_on_validation

segmenter_mobilenet_v3:
  version: 2026-11-20
  task: binary_lesion_segmentation
  architecture: deeplabv3_mobilenet_v3_large
  trained_on:
    dataset: PlantSeg
    source: https://doi.org/10.5281/zenodo.17719108
    license: CC-BY-NC-4.0
  input:
    size: [256, 256]
    resize_rule: stretch_to_exact_size
    preserve_aspect_ratio: false
    crop: none
    color: RGB
    scale: 0-1
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  output:
    type: logits
    channels:
      0: background
      1: diseased_region
    postprocessing: softmax_across_channels
    sigmoid_inside_model: false
  lesion_threshold:
    value: 0.50
    status: serving_default_not_tuned_on_validation

segmenter_resnet50:
  version: 2026-11-20
  task: binary_lesion_segmentation
  architecture: deeplabv3_resnet50
  trained_on:
    dataset: PlantSeg
    source: https://doi.org/10.5281/zenodo.17719108
    license: CC-BY-NC-4.0
  input:
    size: [512, 512]
    resize_rule: stretch_to_exact_size
    preserve_aspect_ratio: false
    crop: none
    color: RGB
    scale: 0-1
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  output:
    type: logits
    channels:
      0: background
      1: diseased_region
    postprocessing: softmax_across_channels
    sigmoid_inside_model: false
  lesion_threshold:
    value: 0.50
    status: serving_default_not_tuned_on_validation
